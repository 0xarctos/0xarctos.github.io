# Allowed values for `arch`. A script using a value missing from this list fails the build.
# Names follow pwntools `context.arch` (also what checksec prints, e.g. "amd64-64-little").

- amd64       # x86-64 / x86_64
- i386        # x86 32-bit
- aarch64     # arm64
- arm         # 32-bit ARM
- mips
- mips64
- riscv64
- powerpc
- powerpc64
